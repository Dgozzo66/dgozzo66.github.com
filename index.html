<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed & Legacy | Mustang x Kawasaki</title>
    <style>
        /* Import custom high-performance fonts */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Poppins', sans-serif;
            overflow: hidden; 
            background-color: #111;
            color: white;
        }

        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .split {
            flex: 1;
            height: 100%;
            position: relative;
            overflow: hidden;
            transition: flex 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        /* Expands the hovered side */
        .split:hover {
            flex: 1.5;
        }

        /* Fixed Direct Background Images */
        .mustang {
            background: url('https://commons.wikimedia.org/wiki/Special:FilePath/1967_Ford_Mustang_GT_Fastback_(14182200538).jpg') center/cover no-repeat;
        }

        .kawasaki {
            background: url('https://commons.wikimedia.org/wiki/Special:FilePath/Kawasaki_ZX-10R.jpg') center/cover no-repeat;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            transition: background 0.5s ease;
        }

        /* Styling the Mustang Side */
        .mustang .overlay {
            background: rgba(0, 0, 0, 0.55);
            border-right: 2px solid #ff2a2a;
        }
        .mustang:hover .overlay {
            background: rgba(180, 20, 20, 0.35); 
        }

        /* Styling the Kawasaki Side */
        .kawasaki .overlay {
            background: rgba(0, 0, 0, 0.55);
            border-left: 2px solid #00ff00;
        }
        .kawasaki:hover .overlay {
            background: rgba(0, 200, 0, 0.35); 
        }

        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 80%;
        }

        h1 {
            font-family: 'Oswald', sans-serif;
            font-size: 4.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 15px rgba(0,0,0,0.9);
            transition: transform 0.3s ease;
        }

        .split:hover h1 {
            transform: scale(1.05);
        }

        p {
            font-size: 1.2rem;
            text-shadow: 1px 1px 8px rgba(0,0,0,0.9);
            opacity: 0.9;
            font-weight: 300;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 30px;
            border: 2px solid white;
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            backdrop-filter: blur(5px);
        }

        .mustang .btn:hover {
            background: #ff2a2a;
            border-color: #ff2a2a;
            box-shadow: 0 0 15px #ff2a2a;
        }

        .kawasaki .btn:hover {
            background: #00ff00;
            border-color: #00ff00;
            color: black;
            box-shadow: 0 0 15px #00ff00;
        }

        /* Center Badge */
        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            font-family: 'Oswald', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: #111;
            padding: 10px 25px;
            border-radius: 4px;
            border: 2px solid #333;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
        }

        .center-logo span:first-child {
            color: #ff2a2a;
        }
        .center-logo span:last-child {
            color: #00ff00;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .split {
                width: 100%;
                height: 50vh;
                border: none !important;
            }
            .split:hover {
                flex: 1;
            }
            .center-logo {
                font-size: 1.5rem;
                padding: 10px 20px;
            }
            h1 {
                font-size: 2.5rem;
            }
            p {
                font-size: 1rem;
            }
            body, html {
                overflow: auto;
            }
        }
    </style>
</head>
<body>

    <div class="center-logo">
        <span>V8</span> x <span>ZX</span>
    </div>

    <div class="container">
        <!-- Left Side: Vintage Mustang -->
        <div class="split mustang">
            <div class="overlay"></div>
            <div class="content">
                <h1>Classic Muscle</h1>
                <p>1967 Ford Mustang. Raw American power, roaring legacy, and timeless design.</p>
                <a href="#" class="btn">Feel the V8</a>
            </div>
        </div>

        <!-- Right Side: Kawasaki Racing -->
        <div class="split kawasaki">
            <div class="overlay"></div>
            <div class="content">
                <h1>Track Weapon</h1>
                <p>Kawasaki Ninja ZX. Pure adrenaline, screaming RPMs, and precision engineering.</p>
                <a href="#" class="btn">Hit Redline</a>
            </div>
        </div>
    </div>

</body>
</html>
